<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店舗業務マニュアル｜サポート</title><style>body{max-width:760px;margin:40px auto;padding:0 24px;font:16px/1.8 system-ui,sans-serif;color:#222}h1{font-size:28px}a{color:#1457a6}</style><main><h1>店舗業務マニュアル</h1><p>写真付きの手順で店舗業務を確認する、スタッフ向けアプリです。</p><h2>サポート</h2><p>アプリの不具合や操作については、<a href="mailto:support@eescc.jp">support@eescc.jp</a>へお問い合わせください。アプリのバージョン、利用端末、発生した問題をお知らせください。パスワード、顧客情報、決済情報は送らないでください。</p><p>店舗業務の判断や緊急連絡は、アプリ内の「緊急時・連絡先」から店舗の担当者へご相談ください。</p><p><a href="privacy.html">プライバシーポリシー</a> · <a href="https://www.eescc.jp/">ESCホームページ</a></p></main></html>
